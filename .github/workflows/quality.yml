name: Validate MCP Workshop and Presentation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MCP Python SDK v2
        run: python -m pip install -r requirements.txt
      - name: Run JS unit tests (engine and demo)
        run: node --test tests/*.test.mjs
      - name: Validate presentation and template portability
        run: |
          python tests/check_deck.py
          python tests/test_quality_checker.py
          python -m unittest discover -s tests -p test_engine_update.py
      - name: Validate MCP workshop and real client/server protocol
        run: |
          python tests/check_workshop.py
          python -m unittest discover -s tests -p 'test_mcp*.py' -v
          python 01_python_sin_mcp.py
          python 02_probar_cliente_mcp.py

  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run full browser E2E (Playwright manages static server)
        run: npm run test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
